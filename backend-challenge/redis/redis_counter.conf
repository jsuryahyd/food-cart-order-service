# Disable RDB persistence (snapshotting)
save "" # Comment out all save lines or set to an empty string

# Disable AOF persistence (append only file)
appendonly no

# No memory limit, or a very large one, if you want to store all unique coupons in memory.
# Setting to 0 means no limit (uses all available RAM).
maxmemory 0

# You might still want a maxmemory-policy if you eventually want to limit RAM usage
# and evict keys when the limit is hit, but for "in memory" counting,
# you likely want no eviction or a very high limit.
# maxmemory-policy noeviction